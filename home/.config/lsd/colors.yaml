# ANSI names only, so lsd follows the terminal palette (Nightfox in Ghostty)
user: yellow
group: dark_yellow
permission:
  read: yellow
  write: dark_yellow
  exec: dark_red
  exec-sticky: dark_magenta
  no-access: dark_grey
  octal: dark_cyan
  acl: dark_cyan
  context: cyan
date:
  hour-old: green
  day-old: dark_green
  older: dark_cyan
size:
  none: dark_grey
  small: green
  medium: yellow
  large: red
inode:
  valid: magenta
  invalid: dark_grey
links:
  valid: magenta
  invalid: dark_grey
tree-edge: dark_grey
git-status:
  default: dark_grey
  unmodified: dark_grey
  ignored: dark_grey
  new-in-index: dark_green
  new-in-workdir: dark_green
  typechange: dark_yellow
  deleted: dark_red
  renamed: dark_green
  modified: dark_yellow
  conflicted: dark_red

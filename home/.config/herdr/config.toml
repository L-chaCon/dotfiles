onboarding = false

[theme]
name = "terminal"
auto_switch = false

# No built-in nightfox: pin its palette (nightfox.nvim) so the UI doesn't
# depend on the terminal colors herdr read when the client attached
[theme.custom]
accent = "#719cd6"
active_row_bg = "#29394f"
selection_bg = "#2b3b51"
surface_dim = "#131a24"
surface0 = "#212e3f"
surface1 = "#29394f"
overlay0 = "#39506d"
overlay1 = "#71839b"
text = "#cdcecf"
subtext0 = "#aeafb0"
mauve = "#9d79d6"
green = "#81b29a"
yellow = "#dbc074"
red = "#c94f6d"
blue = "#719cd6"
teal = "#63cdcf"
peach = "#f4a261"

# Ctrl-Space launches the sessionizer in a popup (fzf folder picker).
[[keys.command]]
key = "ctrl+space"
type = "popup"
command = "~/.local/scripts/herdr-sessionizer"
width = "60%"
height = "60%"

[ui]
tab_bar_position = "bottom"
agent_panel_sort = "priority"
pane_gaps = false
pane_borders = false
sidebar_start_collapsed = true
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[advanced]
scrollback_limit_bytes = 20000000

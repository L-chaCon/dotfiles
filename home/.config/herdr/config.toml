onboarding = false

[theme]
name = "nord"
auto_switch = false

# Ctrl-Space launches the sessionizer in a popup (fzf folder picker).
[[keys.command]]
key = "ctrl+space"
type = "popup"
command = "~/.local/scripts/herdr-sessionizer"
width = "60%"
height = "60%"

[ui]
tab_bar_position = "bottom"
agent_panel_sort = "priority"
pane_gaps = false
pane_borders = false
sidebar_start_collapsed = true
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[advanced]
scrollback_limit_bytes = 20000000
